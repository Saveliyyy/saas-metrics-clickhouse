services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: saas-clickhouse
    ports:
      - "8123:8123"   # HTTP — для DBeaver, Superset, clickhouse-connect
      - "9000:9000"   # нативный протокол
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"   # пользователь default без пароля — только для локальной разработки
    volumes:
      - ch_data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

volumes:
  ch_data:
